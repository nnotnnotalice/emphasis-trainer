<!DOCTYPE html>
<html>
<head>
    <base target="_top">
    <meta charset="UTF-8">
    <link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Тренажёр по ударениям</title>

    <style>
        :root {
            --primary: #8588F2;
            --primary-hover: #7376E8;
            --primary-soft: #EFF1FF;
            --primary-soft-2: #F8F8FF;
            --complete-bg: #E3F7EA;
            --complete-text: #237246;
            --success: #DFF7EA;
            --success-text: #176B3A;
            --error: #FFE0E0;
            --error-text: #B4232B;
            --warning: #9A5A1B;
            --text: #151827;
            --muted: #757B8E;
            --muted-2: #A3A8B8;
            --bg: #FAFAFF;
            --card: rgba(255, 255, 255, 0.86);
            --shadow-soft: 0 18px 48px rgba(74, 80, 145, 0.09);
            --shadow-button: 0 14px 32px rgba(133, 136, 242, 0.24);
            --radius-xl: 30px;
            --radius-lg: 24px;
            --radius-md: 18px;
        }

        * {
            box-sizing: border-box;
        }

        html, body {
            min-height: 100%;
        }

        body {
            font-family: "Onest", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background:
                radial-gradient(circle at 12% 8%, rgba(202, 209, 255, 0.42), transparent 28%),
                radial-gradient(circle at 88% 18%, rgba(255, 224, 235, 0.36), transparent 26%),
                linear-gradient(180deg, #ffffff 0%, #f7f7ff 100%);
            color: var(--text);
            margin: 0;
            padding: 0;
            min-height: 100vh;
        }

        body.teacher-dashboard-screen {
            --teacher-page-bg: #faf8f5;
            --teacher-surface: #ffffff;
            --teacher-header-from: #3f58bb;
            --teacher-header-to: #233ca1;
            --teacher-accent: #3f58bb;
            --teacher-progress-accent: #6366f1;
            --teacher-progress-fill: #fccc6b;
            --teacher-text: #111827;
            --teacher-text-secondary: #6b7280;
            --teacher-text-muted: #9ca3af;
            --teacher-border: #f0efee;
            --teacher-success: #0ab448;
            --teacher-success-bg: rgba(34, 197, 94, 0.12);
            --teacher-danger: #ff4852;
            --teacher-danger-bg: #fee2e2;
            --teacher-danger-hover-bg: #fff5f5;
            --teacher-archive: #a5a8ae;
            --teacher-archive-hover: #94979e;
            --teacher-on-color: #faf8f5;
            background:
                linear-gradient(90deg, var(--teacher-header-from) 0%, var(--teacher-header-to) 100%) 0 0 / 100% 260px no-repeat,
                var(--teacher-page-bg);
            overflow-x: hidden;
            overflow-y: auto;
        }

        body.teacher-dashboard-screen .app {
            padding: 0;
            overflow-x: hidden;
            overflow-y: visible;
        }

        body.teacher-dashboard-screen .main {
            width: auto;
            padding-top: 0;
        }

        body.teacher-dashboard-screen #mainInterface {
            width: 100%;
        }

        .app {
            width: 100%;
            min-height: 100vh;
            max-width: none;
            margin: 0;
            padding: 0 clamp(22px, 5vw, 76px) 44px;
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            background: transparent;
            border-radius: 0;
            box-shadow: none;
            overflow-x: hidden;
        }

        body.app-booting {
            background: #faf8f5;
        }

        body.app-booting .app > :not(#loaderOverlay) {
            visibility: hidden;
        }

        body.app-booting #loaderOverlay.hidden {
            position: fixed;
            display: flex !important;
            background: #faf8f5;
            backdrop-filter: none;
        }

        .app-header {
            width: 100%;
            margin: 0 calc(50% - 50vw) clamp(44px, 6vh, 78px);
            padding: clamp(30px, 4.2vh, 50px) clamp(24px, 6vw, 92px) clamp(32px, 4.6vh, 54px);
            border-radius: 0 0 22px 22px;
            background: linear-gradient(135deg, rgba(111, 113, 232, 0.82), rgba(78, 83, 208, 0.76));
            border: 1px solid rgba(255, 255, 255, 0.18);
            border-top: none;
            box-shadow: 0 18px 48px rgba(91, 94, 193, 0.16);
            backdrop-filter: blur(14px);
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            overflow: hidden;
            z-index: 25;
        }

        .app-header::after {
            content: none;
        }

        h1 {
            font-size: clamp(31px, 3.2vw, 50px);
            line-height: 1.06;
            margin: 0;
            text-align: center;
            font-weight: 470;
            letter-spacing: -0.035em;
            color: #ffffff;
            position: relative;
            z-index: 1;
        }

        .subtitle {
            font-size: clamp(20px, 2vw, 30px);
            color: var(--muted);
            text-align: center;
            margin-bottom: 18px;
            font-weight: 500;
            letter-spacing: -0.015em;
        }

        .main {
            width: min(1240px, 100%);
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding-top: clamp(170px, 21vh, 210px);
            animation: fadeUp 0.38s ease both;
        }

        #mainInterface {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .hidden {
            display: none !important;
        }

        .back-btn {
            position: fixed;
            top: 28px;
            left: clamp(10px, 1.8vw, 24px);
            background: transparent;
            color: #ffffff;
            border: none;
            border-radius: 0;
            width: 75px;
            height: 75px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 0;
            box-shadow: none;
            transition: transform 0.18s ease;
            z-index: 30;
        }

        .back-btn svg {
            width: 75px;
            height: 75px;
            display: block;
        }

        .back-btn:hover {
            transform: translateY(-2px) scale(1.03);
            box-shadow: none;
        }

        .back-btn svg path {
            fill: currentColor;
        }

        .back-btn:active,
        .option-btn:active,
        .result-btn:active,
        .student-login-btn:active,
        .pos-card:active {
            transform: translateY(1px) scale(0.99);
        }

        .student-info {
            display: none;
        }

        .student-header-pill {
            display: none;
        }

        .student-change-btn,
        .teacher-link-btn {
            border: none;
            background: transparent;
            color: var(--primary);
            cursor: pointer;
            font-family: inherit;
            font-size: inherit;
            font-weight: 500;
            text-decoration: underline;
            text-underline-offset: 4px;
        }

        .options {
            width: min(760px, 100%);
            display: flex;
            flex-direction: column;
            gap: 18px;
            align-items: center;
            margin: 10px auto 0;
        }

        .option-btn {
            width: min(680px, 100%);
            min-height: 96px;
            padding: 24px 32px;
            border-radius: var(--radius-lg);
            border: 2px solid rgba(124, 127, 242, 0.05);
            cursor: pointer;
            font-family: inherit;
            font-size: clamp(28px, 3.2vw, 44px);
            line-height: 1.1;
            text-align: center;
            background: rgba(255, 255, 255, 0.92);
            color: var(--text);
            box-shadow: 0 12px 32px rgba(64, 70, 120, 0.08);
            transition: transform 0.16s ease, box-shadow 0.16s ease, background 0.16s ease, border-color 0.16s ease;
            font-weight: 500;
            animation: optionIn 0.28s ease both;
        }

        .option-btn:hover:not(:disabled) {
            transform: translateY(-4px);
            box-shadow: 0 18px 42px rgba(64, 70, 120, 0.12);
            border-color: rgba(124, 127, 242, 0.16);
            background: #ffffff;
        }

        .option-btn.correct {
            background: var(--success);
            color: var(--success-text);
            border-color: rgba(42, 157, 91, 0.16);
            animation: correctPulse 0.44s ease both;
        }

        .option-btn.wrong {
            background: var(--error);
            color: var(--error-text);
            border-color: rgba(180, 35, 43, 0.12);
            animation: wrongShake 0.34s ease both;
        }

        .option-btn:disabled {
            cursor: default;
            opacity: 0.96;
        }

        .status {
            min-height: 24px;
            font-size: clamp(16px, 1.5vw, 20px);
            margin-top: 18px;
            text-align: center;
            color: var(--muted);
            line-height: 1.35;
        }

        .status.err {
            color: #cf2e3a;
            font-weight: 500;
        }

        .loader-overlay {
            position: fixed;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(250, 250, 255, 0.72);
            backdrop-filter: blur(8px);
            z-index: 100;
        }

        .loader {
            border: 5px solid #EEF0FF;
            border-top: 5px solid var(--primary);
            border-radius: 50%;
            width: 42px;
            height: 42px;
            animation: spin 0.75s linear infinite;
        }

        .pos-choices {
            width: min(1520px, 96vw);
            display: grid;
            grid-template-columns: repeat(2, minmax(600px, 1fr));
            gap: clamp(34px, 3.2vw, 52px);
            justify-content: center;
            align-items: start;
            margin-top: clamp(32px, 4.2vh, 58px);
        }

        .pos-card {
            width: 100%;
            min-height: clamp(300px, 28vh, 360px);
            padding: clamp(44px, 3.6vw, 58px);
            border-radius: 42px;
            border: 1px solid rgba(133, 136, 242, 0.10);
            background: rgba(255, 255, 255, 0.80);
            box-shadow: 0 22px 58px rgba(74, 80, 145, 0.075);
            transition:
                transform 0.28s cubic-bezier(.2,.8,.2,1),
                box-shadow 0.28s cubic-bezier(.2,.8,.2,1),
                border-color 0.28s ease,
                background 0.28s ease;
            text-align: left;
            font-family: inherit;
            backdrop-filter: blur(12px);
            animation: cardEnter 0.55s cubic-bezier(.2,.8,.2,1) both;
            display: grid;
            grid-template-rows: 110px 18px minmax(58px, auto);
            align-content: center;
            row-gap: 28px;
            position: relative;
            overflow: hidden;
        }

        .pos-card::before,
        .pos-card::after {
            content: none;
        }

        .pos-card:hover {
            transform: translateY(-16px) scale(1.03);
            box-shadow: 0 40px 92px rgba(86, 91, 178, 0.20);
            border-color: rgba(133, 136, 242, 0.40);
            background: rgba(255, 255, 255, 0.98);
        }

        .pos-card.first-pulse {
            animation: cardEnter 0.55s cubic-bezier(.2,.8,.2,1) both, softPulse 2.8s ease-in-out 0.7s 3;
        }

        .pos-title {
            font-size: clamp(27px, 2.05vw, 34px);
            line-height: 1.12;
            font-weight: 430;
            color: var(--text);
            margin: 0;
            letter-spacing: -0.03em;
            overflow-wrap: normal;
            word-break: normal;
            hyphens: none;
            display: flex;
            align-items: flex-start;
        }

        .pos-progress-text {
            display: none;
        }

        .pos-progress-bar {
            width: 100%;
            height: 18px;
            background: var(--primary-soft);
            border-radius: 999px;
            overflow: hidden;
            box-shadow: inset 0 1px 3px rgba(74, 80, 145, 0.06);
        }

        .pos-progress-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #7C7FF2, #A7A9FF);
            border-radius: 999px;
            transition: width 0.72s cubic-bezier(.2,.8,.2,1);
        }

        .pos-repeat-note {
            margin: 0;
            align-self: start;
            font-size: clamp(17px, 1.28vw, 20px);
            line-height: 1.25;
            color: var(--warning);
            font-weight: 430;
        }

        .pos-repeat-note:empty {
            display: none;
        }

        .pos-repeat-note.completed {
            display: inline-flex;
            align-self: flex-start;
            width: auto;
            padding: 13px 18px;
            border-radius: 12px;
            background: var(--complete-bg);
            color: var(--complete-text);
            font-weight: 430;
        }

        body.student-pos-selection-screen {
            background: #faf8f5;
            overflow-x: hidden;
        }

        body.student-pos-selection-screen .app {
            padding: 0;
            background: #faf8f5;
            overflow-x: hidden;
        }

        body.student-pos-selection-screen .app-header {
            height: 80px;
            margin: 0;
            padding: 0 40px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border: 0;
            border-radius: 0;
            background: linear-gradient(90deg, #3f58bb 0%, #233ca1 100%);
            box-shadow: none;
            backdrop-filter: none;
        }

        body.student-pos-selection-screen .app-header h1 {
            position: absolute;
            left: 50%;
            top: 18px;
            transform: translateX(-50%);
            margin: 0;
            color: #faf8f5;
            font-size: 35px;
            line-height: normal;
            font-weight: 600;
            letter-spacing: 0;
            text-align: center;
            white-space: nowrap;
        }

        body.student-pos-selection-screen .student-header-pill {
            position: absolute;
            top: 18px;
            right: 40px;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            min-height: 44px;
            padding: 8px 12px;
            border-radius: 999px;
            background: rgba(250, 248, 245, 0.9);
            color: #1e293b;
            font-size: 14px;
            line-height: normal;
            font-weight: 700;
            white-space: nowrap;
            border: 0;
            cursor: default;
            font-family: inherit;
        }

        .student-header-avatar {
            width: 28px;
            height: 28px;
            border-radius: 999px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background: #3f58bb;
            color: #ffffff;
            overflow: hidden;
        }

        .student-header-avatar img {
            width: 28px;
            height: 28px;
            display: block;
        }

        body.student-pos-selection-screen .main {
            width: 100%;
            padding: 120px 40px 40px;
            animation: none;
        }

        body.student-pos-selection-screen #mainInterface {
            width: 100%;
        }

        body.student-pos-selection-screen .options {
            width: 100%;
            margin: 0;
            align-items: stretch;
        }

        body.student-pos-selection-screen .subtitle,
        body.student-pos-selection-screen .status {
            display: none;
        }

        body.student-pos-selection-screen .back-btn {
            top: 18px;
            left: 36px;
            width: 44px;
            height: 44px;
        }

        body.student-pos-selection-screen .back-btn svg {
            width: 34px;
            height: 34px;
            display: none;
        }

        body.student-pos-selection-screen .back-btn::before {
            content: "";
            width: 36px;
            height: 36px;
            display: block;
            background: url("https://www.figma.com/api/mcp/asset/7bd03888-7413-4baa-8811-0c655395ee6f") center / contain no-repeat;
        }

        body.student-pos-selection-screen .back-btn:hover {
            transform: translateY(-2px) scale(1.03);
        }

        body.student-pos-selection-screen .pos-choices {
            width: 100%;
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 24px;
            align-items: start;
            margin: 0;
        }

        body.student-pos-selection-screen .pos-card {
            height: 261px;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            border: 0;
            border-radius: 20px;
            background: #ffffff;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
            backdrop-filter: none;
            cursor: default;
            overflow: hidden;
            transform: none;
            transition: box-shadow 0.2s ease, min-height 0.28s ease;
        }

        body.student-pos-selection-screen .pos-card:hover {
            transform: none;
            border-color: transparent;
            background: #ffffff;
            box-shadow: 0 8px 26px rgba(15, 23, 42, 0.08);
        }

        body.student-pos-selection-screen .pos-card:active {
            transform: none;
        }

        body.student-pos-selection-screen .pos-card.expanded {
            height: auto;
            min-height: 382px;
        }

        body.student-pos-selection-screen .pos-card.first-pulse {
            animation: cardEnter 0.32s ease both;
        }

        .pos-card-header {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 16px;
        }

        body.student-pos-selection-screen .pos-title {
            margin: 0;
            color: #1f2937;
            font-size: 20px;
            line-height: normal;
            font-weight: 600;
            letter-spacing: 0;
        }

        .pos-status-badge {
            flex: 0 0 auto;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-width: 96px;
            min-height: 24px;
            padding: 4px 10px;
            border-radius: 6px;
            background: #d9e1fe;
            color: #3f58bb;
            font-size: 12px;
            line-height: normal;
            font-weight: 600;
            white-space: nowrap;
        }

        .pos-status-badge.completed {
            background: #dcfce7;
            color: #166534;
        }

        .pos-status-badge.not-started {
            background: #f4f6f8;
            color: #94a3b8;
        }

        .pos-progress {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        body.student-pos-selection-screen .pos-progress-text {
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            color: #6b7280;
            font-size: 12px;
            line-height: normal;
            font-weight: 400;
            white-space: nowrap;
        }

        body.student-pos-selection-screen .pos-progress-bar {
            width: 100%;
            height: 8px;
            border-radius: 4px;
            background: #faf8f5;
            box-shadow: none;
        }

        body.student-pos-selection-screen .pos-progress-fill {
            height: 100%;
            border-radius: 4px;
            background: #fccc6b;
            transition: width 0.72s cubic-bezier(.2,.8,.2,1);
        }

        .pos-problems-shell {
            display: flex;
            flex-direction: column;
            min-height: 56px;
        }

        .pos-problems-toggle,
        .pos-no-errors {
            width: 100%;
            min-height: 36px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            padding: 12px 16px;
            border: 0;
            border-radius: 12px;
            font-family: inherit;
            font-size: 14px;
            line-height: normal;
            text-align: left;
        }

        .pos-problems-toggle {
            cursor: pointer;
            background: #fff8e7;
            color: #1f2937;
            font-weight: 500;
        }

        .pos-card.expanded .pos-problems-toggle {
            border-radius: 12px 12px 0 0;
        }

        .pos-no-errors {
            background: #dcfce7;
            color: #15803d;
            font-weight: 600;
        }

        .pos-problems-label {
            min-width: 0;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .pos-alert-icon {
            width: 16px;
            height: 16px;
            flex: 0 0 auto;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        .pos-alert-icon img {
            width: 16px;
            height: 16px;
            display: block;
        }

        .pos-chevron {
            width: 16px;
            height: 16px;
            flex: 0 0 auto;
            color: #6b7280;
        }

        .pos-problems-panel {
            display: grid;
            grid-template-rows: 0fr;
            overflow: hidden;
            opacity: 0;
            background: #fff8e7;
            border-radius: 0 0 12px 12px;
            transition: grid-template-rows 0.32s ease, opacity 0.22s ease;
        }

        .pos-card.expanded .pos-problems-panel {
            grid-template-rows: 1fr;
            opacity: 1;
        }

        .pos-card.expanded .pos-practice-btn {
            position: static;
            width: 100%;
            margin-top: 4px;
        }

        .pos-problem-chips {
            min-height: 0;
            overflow: hidden;
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            padding: 16px 16px 24px;
        }

        .pos-problem-chip {
            display: inline-flex;
            align-items: center;
            min-height: 28px;
            padding: 6px 12px;
            border-radius: 6px;
            background: #fef3c7;
            color: #d97706;
            font-size: 14px;
            line-height: normal;
            font-weight: 500;
            white-space: nowrap;
        }

        .pos-practice-btn {
            position: absolute;
            left: 24px;
            right: 24px;
            bottom: 24px;
            width: auto;
            height: 42px;
            flex: 0 0 auto;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border: 0;
            border-radius: 12px;
            background: #ff4852;
            color: #ffffff;
            cursor: pointer;
            transition: transform 0.16s ease, background 0.16s ease;
        }

        .pos-practice-btn:hover {
            transform: translateY(-1px);
            background: #f43d48;
        }

        .pos-practice-btn img {
            width: 26px;
            height: 26px;
            display: block;
        }

        .pos-chevron img {
            width: 16px;
            height: 16px;
            display: block;
        }

        .question-progress {
            width: min(720px, 100%);
            margin: 0 auto 34px;
            padding: clamp(24px, 3vw, 34px);
            text-align: center;
            animation: fadeUp 0.28s ease both;
            background: rgba(255, 255, 255, 0.74);
            border: 1px solid rgba(133, 136, 242, 0.09);
            border-radius: var(--radius-lg);
            box-shadow: 0 18px 48px rgba(74, 80, 145, 0.07);
            backdrop-filter: blur(12px);
        }

        .question-progress-title {
            font-size: clamp(24px, 2.4vw, 34px);
            color: var(--text);
            margin-bottom: 20px;
            font-weight: 470;
            letter-spacing: -0.02em;
        }

        .question-progress-track {
            width: 100%;
            height: 16px;
            background: var(--primary-soft);
            border-radius: 999px;
            overflow: hidden;
            box-shadow: inset 0 1px 3px rgba(66, 72, 130, 0.08);
        }

        .question-progress-fill {
            height: 100%;

            0% { transform: scale(1); }

    <script>
        // Константы
        const DELAY_AFTER_CORRECT = 700;
        const DELAY_AFTER_WRONG = 1800;
        const SESSION_WORD_LIMIT = 12;
        const ERROR_MIX_LIMIT = 4;
        const REVIEW_CORRECT_STREAK = 3;
        const PERFECT_RESULT_TITLES = [
            "Ни одной ошибки!",
            "Верно!",
            "Так держать!"
        ];

        // Переменные состояния
        let currentPOS = null;
        let currentBatch = [];
        let currentBatchNumber = null;
        let currentIndex = 0;
        let mistakes = [];
        let lastErrorsForReview = [];
        let answered = false;
        let isReviewMode = false;
        let currentScreen = "student";
        let currentStudentId = null;
        let pendingQuestionAdvanceTimeout = null;
        let teacherDashboardNotice = "";
        let teacherDashboardSearch = "";
        let expandedTeacherStudentId = "";
        let expandedTeacherErrorListId = "";
        let expandedPOSProblem = "";

        // Ссылка на опубликованную Google Таблицу с контентом
        const SHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vTDdC5lavnQYQbH_FusZ_u7Kaxe-PpGP5A4ERKWV3MVdyJWHKuAxYZ6ivOTQr6d3e2_A_hxDdiQw-yH/pub?gid=413569060&single=true&output=csv";
        const FIGMA_ASSETS = {
            avatar: "https://www.figma.com/api/mcp/asset/408fc647-be61-47f3-991c-08edd884b12a",
            alertCircle: "https://www.figma.com/api/mcp/asset/092a276f-3a8b-48ff-84aa-006ddb77c049",
            chevronDown: "https://www.figma.com/api/mcp/asset/af0970d3-05d2-4e98-8f3f-dc181c72bc9f",
            chevronUp: "https://www.figma.com/api/mcp/asset/34ca1974-d809-456a-8213-2338fdffdc83",
            quizBack: "https://www.figma.com/api/mcp/asset/540c5afc-a104-40e6-ad92-b7b679b9bcb6",
            pencil: "https://www.figma.com/api/mcp/asset/14bc25c7-2c09-47fc-aa1f-1703ee12e795",
            play: "https://www.figma.com/api/mcp/asset/7b48470a-6b51-43c6-af59-a57fa5e2c435"
        };

        // UID методиста из Firebase Authentication.
        const TEACHER_UID = "NDBX67iGclQjJvLcIXLGUyLuSXr1";
        const CODE_WORDS = [
            "КОТ", "СОВА", "ЛИСА", "МЯЧ", "РАК", "ДОМ", "КИТ", "ЁЖ",
            "САД", "ЛЕС", "МАК", "СОК", "ЧАЙ", "ЖУК", "СЫР", "НОС",
            "ЗУБ", "МЁД", "ЛУК", "СУП", "ПАРК", "ЗОНТ", "ШАР", "КЛЮЧ",
            "КУБ", "БАНТ", "ГРИБ", "МОСТ", "ПЛЕД", "ТИГР", "ЛЕВ", "ГНОМ",
            "СЛОН", "ПИР", "КРАБ", "ФЛАГ", "СНЕГ", "ГУСЬ", "СТОЛ", "ЛАМПА",
            "ТОРТ", "КРОТ", "БОБР", "ЛОЖКА", "МАЯК", "ПЕРО", "КАМЕНЬ", "ХЛЕБ"
        ];

        // Сюда приложение загрузит слова из таблицы
        let wordsData = {};

        // Firebase: общая база для прогресса учеников
        const firebaseConfig = {
            apiKey: "AIzaSyCYFXcST8-Ak0zuj-ZlShcVunuaYDB8Xgo",
            authDomain: "emphasis-trainer.firebaseapp.com",
            projectId: "emphasis-trainer",
            storageBucket: "emphasis-trainer.firebasestorage.app",
            messagingSenderId: "377679695147",
            appId: "1:377679695147:web:5c46b71011ff221c76096e"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const auth = firebase.auth();

        // ===== FIREBASE AUTH =====

        async function ensureAnonymousAuth() {
            const user = auth.currentUser;

            if (user && user.isAnonymous) {
                return user;
            }

            if (user && !user.isAnonymous) {
                await auth.signOut();
            }

            const credential = await auth.signInAnonymously();
            return credential.user;
        }

        async function ensureStudentProfile(studentId) {
            if (!studentId) return null;

            const user = await ensureAnonymousAuth();
            const now = new Date().toISOString();
            const studentRef = db.collection("students").doc(studentId);

            let studentDoc;
            try {
                studentDoc = await studentRef.get();
            } catch (error) {
                // Если правила Firestore не дают прочитать документ, не пускаем в ID.
                // Для ученика безопаснее получить отказ, чем случайно создать локальный прогресс под чужим ID.
                const blocked = new Error("student_id_taken");
                blocked.code = "student_id_taken";
                throw blocked;
            }

            if (!studentDoc.exists) {
                const error = new Error("student_id_not_found");
                error.code = "student_id_not_found";
                throw error;
            }

            const data = studentDoc.data() || {};

            if (!data.owner_uid) {
                await studentRef.set({
                    student_id: studentId,
                    owner_uid: user.uid,
                    last_seen_at: now
                }, { merge: true });

                return user;
            }

            if (data.owner_uid === user.uid) {
                await studentRef.set({
                    student_id: studentId,
                    last_seen_at: now
                }, { merge: true });

                return user;
            }

            const error = new Error("student_id_taken");
            error.code = "student_id_taken";
            throw error;
        }

        async function signInTeacher(email, password) {
            if (auth.currentUser) {
                await auth.signOut();
            }

            const credential = await auth.signInWithEmailAndPassword(email, password);

            if (credential.user.uid !== TEACHER_UID) {
                await auth.signOut();
                throw new Error("not_teacher");
            }

            return credential.user;
        }

        function ensureTeacherAuth() {
            const user = auth.currentUser;

            if (!user || user.isAnonymous || user.uid !== TEACHER_UID) {
                throw new Error("not_teacher");
            }

            return user;
        }

        async function sendTeacherPasswordReset() {
            const user = ensureTeacherAuth();
            const email = user.email;

            if (!email) {
                throw new Error("teacher_email_missing");
            }

            await auth.sendPasswordResetEmail(email);
            teacherDashboardNotice = `Письмо для смены пароля отправлено на ${email}`;
            await showTeacherDashboard();
        }

        async function signOutTeacher() {
            if (auth.currentUser && !auth.currentUser.isAnonymous) {
                await auth.signOut();
            }
            showStudentLogin();
        }

        // Загрузка слов из Google Таблицы
        async function loadWordsFromSheet() {
            const response = await fetch(SHEET_CSV_URL);

            if (!response.ok) {
                throw new Error("Не удалось загрузить таблицу со словами");
            }

            const csvText = await response.text();
            const rows = parseCSV(csvText);

            if (!rows.length) {
                throw new Error("Таблица пустая");
            }

            const headers = rows[0].map(h => h.trim());
            const dataRows = rows.slice(1);
            const result = {};

            dataRows.forEach(row => {
                const item = {};

                headers.forEach((header, index) => {
                    item[header] = (row[index] || "").trim();
                });

                // Пропускаем полностью пустые строки
                if (!item.word_id && !item.correct_word && !item.wrong_options) return;

                // Берём только активные слова
                if (String(item.is_active).toUpperCase() !== "TRUE") return;

                const pos = item.pos;
                const batchId = Number(item.batch_id);

                if (!pos || !batchId || !item.word_id || !item.correct_word || !item.wrong_options) {
                    console.warn("Строка пропущена: не хватает обязательных данных", item);
                    return;
                }

                if (!result[pos]) result[pos] = {};
                if (!result[pos][batchId]) result[pos][batchId] = [];

                result[pos][batchId].push({
                    pos: item.pos,
                    pos_code: item.pos_code,
                    batch_id: batchId,
                    word_number: Number(item.word_number),
                    word_id: item.word_id,
                    correct_word: item.correct_word,
                    wrong_options: item.wrong_options
                });
            });

            // Сортируем batch и слова внутри batch
            Object.keys(result).forEach(pos => {
                Object.keys(result[pos]).forEach(batchId => {
                    result[pos][batchId].sort((a, b) => a.word_number - b.word_number);
                });
            });

            wordsData = result;

            console.log("Слова загружены из таблицы:", wordsData);
        }

        // Простой CSV-парсер для нашей таблицы
        // В таблице нет запятых внутри ячеек, поэтому сложный парсер не нужен
        function parseCSV(text) {
            return text
                .trim()
                .split(/\r?\n/)
                .map(line => line.split(","));
        }

        // ===== УЧЕНИК И ЛОКАЛЬНЫЙ ПРОГРЕСС ПО СЛОВАМ =====

        function normalizeStudentId(value) {
            return String(value || "")
                .trim()
                .toUpperCase()
                .replace(/\s+/g, "")
                .replace(/[—–]/g, "-");
        }

        function generateStudentId() {
            const word = CODE_WORDS[Math.floor(Math.random() * CODE_WORDS.length)];
            const number = String(Math.floor(Math.random() * 1000)).padStart(3, "0");
            return `${word}-${number}`;
        }

        function getSavedStudentId() {
            return normalizeStudentId(localStorage.getItem("currentStudentId") || "");
        }

        function saveStudentId(studentId) {
            currentStudentId = normalizeStudentId(studentId);
            localStorage.setItem("currentStudentId", currentStudentId);
        }

        function clearStudentId() {
            currentStudentId = null;
            localStorage.removeItem("currentStudentId");
        }

        function getPulseStorageKey() {
            const id = currentStudentId || getSavedStudentId() || "guest";
            return `posPulseSeen_${id}`;
        }

        function hasSeenPOSPulse() {
            return localStorage.getItem(getPulseStorageKey()) === "1";
        }

        function markPOSPulseSeen() {
            localStorage.setItem(getPulseStorageKey(), "1");
        }

        function getProgressStorageKey() {
            const id = currentStudentId || getSavedStudentId() || "guest";
            return `seenWords_${id}`;
        }

        function getSeenWords() {
            try {
                return JSON.parse(localStorage.getItem(getProgressStorageKey()) || "{}");
            } catch (error) {
                return {};
            }
        }

        function saveSeenWords(seenWords) {
            localStorage.setItem(getProgressStorageKey(), JSON.stringify(seenWords));
        }

        function markWordAsSeen(word, isCorrect) {
            if (!word || !word.word_id) return;

            const seenWords = getSeenWords();
            const previous = seenWords[word.word_id] || {};
            const previousCorrectStreak = Number(previous.correct_streak || 0);
            const correctStreak = isCorrect ? previousCorrectStreak + 1 : 0;
            const needsReview = isCorrect
                ? correctStreak < REVIEW_CORRECT_STREAK && Boolean(previous.needs_review)
                : true;

            const updatedProgress = {
                ...previous,
                word_id: word.word_id,
                pos: word.pos,
                pos_code: word.pos_code,
                batch_id: word.batch_id,
                word_number: word.word_number,
                correct_word: word.correct,
                wrong_options: word.wrong,
                seen: true,
                seen_count: Number(previous.seen_count || 0) + 1,
                correct_count: Number(previous.correct_count || 0) + (isCorrect ? 1 : 0),
                wrong_count: Number(previous.wrong_count || 0) + (isCorrect ? 0 : 1),
                correct_streak: correctStreak,
                needs_review: needsReview,
                last_answer_correct: isCorrect,
                last_seen_at: new Date().toISOString()
            };

            seenWords[word.word_id] = updatedProgress;
            saveSeenWords(seenWords);
            saveWordProgressToFirebase(updatedProgress);
        }

        async function loadSeenWordsFromFirebase(studentId) {
            if (!studentId) return;

            try {
                await ensureStudentProfile(studentId);

                const snapshot = await db
                    .collection("students")
                    .doc(studentId)
                    .collection("wordProgress")
                    .get();

                const firebaseWords = {};
                snapshot.forEach(doc => {
                    firebaseWords[doc.id] = doc.data();
                });

                const localWords = getSeenWords();
                saveSeenWords({ ...localWords, ...firebaseWords });

                await ensureStudentProfile(studentId);

                console.log("Прогресс загружен из Firebase:", firebaseWords);
            } catch (error) {
                if (error.code === "student_id_taken" || error.message === "student_id_taken") {
                    throw error;
                }

                console.warn("Не удалось загрузить прогресс из Firebase.", error);
                throw error;
            }
        }

        async function saveWordProgressToFirebase(progressEntry) {
            if (!currentStudentId || !progressEntry || !progressEntry.word_id) return;

            try {
                const now = progressEntry.last_seen_at || new Date().toISOString();

                await ensureStudentProfile(currentStudentId);

                await db
                    .collection("students")
                    .doc(currentStudentId)
                    .collection("wordProgress")
                    .doc(progressEntry.word_id)
                    .set({
                        word_id: progressEntry.word_id,
                        pos: progressEntry.pos,
                        pos_code: progressEntry.pos_code,
                        batch_id: progressEntry.batch_id,
                        word_number: progressEntry.word_number,
                        correct_word: progressEntry.correct_word,
                        wrong_options: progressEntry.wrong_options,
                        seen: true,
                        seen_count: progressEntry.seen_count || 0,
                        correct_count: progressEntry.correct_count || 0,
                        wrong_count: progressEntry.wrong_count || 0,
                        correct_streak: progressEntry.correct_streak || 0,
                        needs_review: Boolean(progressEntry.needs_review),
                        last_answer_correct: Boolean(progressEntry.last_answer_correct),
                        last_seen_at: now
                    }, { merge: true });

                await db.collection("students").doc(currentStudentId).set({
                    student_id: currentStudentId,
                    owner_uid: auth.currentUser ? auth.currentUser.uid : null,
                    last_seen_at: now
                }, { merge: true });
            } catch (error) {
                console.warn("Не удалось сохранить прогресс в Firebase. Локальный прогресс сохранён.", error);
            }
        }

        function getAllWordsByPOS(pos) {
            if (!wordsData[pos]) return [];

            return Object.values(wordsData[pos])
                .flat()
                .filter(word => word && word.word_id);
        }

        function getProgressByPOS(pos) {
            const allWords = getAllWordsByPOS(pos);
            const seenWords = getSeenWords();

            const seenCount = allWords.filter(word => seenWords[word.word_id]).length;
            const totalCount = allWords.length;

            return {
                seenCount,
                totalCount,
                percent: totalCount ? Math.round((seenCount / totalCount) * 100) : 0
            };
        }

        function getNextBatchNumber(pos) {
            const batches = Object.keys(wordsData[pos] || {})
                .map(Number)
                .sort((a, b) => a - b);

            const seenWords = getSeenWords();

            for (const batchNumber of batches) {
                const batchWords = wordsData[pos][batchNumber] || [];
                const hasUnseenWords = batchWords.some(word => !seenWords[word.word_id]);

                if (hasUnseenWords) {
                    return batchNumber;
                }
            }

            // Если все слова уже встречались, снова даём первый batch для повторения.
            return batches[0];
        }

        function prepareQuestion(word) {
            const options = [word.correct_word, word.wrong_options];
            const shuffledOptions = [...options].sort(() => Math.random() - 0.5);
            const correctIndex = shuffledOptions.indexOf(word.correct_word);

            return {
                word_id: word.word_id,
                pos: word.pos,
                pos_code: word.pos_code,
                batch_id: word.batch_id,
                word_number: word.word_number,
                options: shuffledOptions,
                correctIndex: correctIndex,
                correct: word.correct_word,
                wrong: word.wrong_options
            };
        }

        function isUnresolvedProgressItem(item) {
            if (!item) return false;

            if (item.needs_review === true) return true;
            if (item.needs_review === false) return false;

            // Поддержка старых записей, которые были созданы до появления needs_review.
            return Number(item.wrong_count || 0) > Number(item.correct_count || 0);
        }

        function getUnresolvedErrorWordsByPOS(pos) {
            const seenWords = getSeenWords();
            const wordsById = new Map(getAllWordsByPOS(pos).map(word => [word.word_id, word]));

            return Object.values(seenWords)
                .filter(item => wordsById.has(item.word_id))
                .filter(isUnresolvedProgressItem)
                .sort((a, b) => {
                    const wrongDiff = Number(b.wrong_count || 0) - Number(a.wrong_count || 0);
                    if (wrongDiff !== 0) return wrongDiff;
                    return String(b.last_seen_at || "").localeCompare(String(a.last_seen_at || ""));
                })
                .map(item => wordsById.get(item.word_id));
        }

        function shuffleArray(items) {
            const result = [...items];

            for (let i = result.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [result[i], result[j]] = [result[j], result[i]];
            }

            return result;
        }

        function buildTrainingWords(pos) {
            const allWords = getAllWordsByPOS(pos);
            if (!allWords.length) return [];

            const seenWords = getSeenWords();
            const allWordsHaveBeenSeen = allWords.every(word => seenWords[word.word_id]);
            const repeatWords = getUnresolvedErrorWordsByPOS(pos).slice(0, ERROR_MIX_LIMIT);
            const usedIds = new Set(repeatWords.map(word => word.word_id));

            // Пока ребёнок ещё не видел все слова части речи,
            // идём по таблице: ошибки + следующие новые слова по порядку.
            if (!allWordsHaveBeenSeen) {
                const nextBatchNumber = getNextBatchNumber(pos);
                if (!nextBatchNumber) return [];

                const nextBatchWords = wordsData[pos][nextBatchNumber] || [];

                const newWords = nextBatchWords
                    .filter(word => !usedIds.has(word.word_id))
                    .filter(word => !seenWords[word.word_id]);

                const fallbackWords = nextBatchWords
                    .filter(word => !usedIds.has(word.word_id))
                    .filter(word => seenWords[word.word_id]);

                return [
                    ...repeatWords,
                    ...newWords,
                    ...fallbackWords
                ].slice(0, SESSION_WORD_LIMIT);
            }

            // Когда все слова этой части речи уже хотя бы раз встречались,
            // порядок таблицы больше не важен: повторяем слова случайно.
            const randomReviewWords = shuffleArray(
                allWords.filter(word => !usedIds.has(word.word_id))
            );

            return [
                ...repeatWords,
                ...randomReviewWords
            ].slice(0, SESSION_WORD_LIMIT);
        }

        function startNextTraining(pos) {
            currentPOS = pos;
            setLoading(true);

            const trainingWords = buildTrainingWords(pos);

            if (!trainingWords.length) {
                setLoading(false);
                setStatus("Для этой части речи пока нет слов", "err");
                return;
            }

            startTrainingSession(pos, trainingWords);
        }

        async function loadTeacherData() {
            ensureTeacherAuth();
            const studentsSnapshot = await db.collection("students").get();
            const students = [];

            for (const studentDoc of studentsSnapshot.docs) {
                const studentData = studentDoc.data() || {};
                const progressSnapshot = await db
                    .collection("students")
                    .doc(studentDoc.id)
                    .collection("wordProgress")
                    .get();

                const progressMap = {};
                progressSnapshot.forEach(doc => {
                    progressMap[doc.id] = doc.data();
                });

                students.push({
                    id: studentDoc.id,
                    display_name: String(studentData.display_name || "").trim(),
                    is_archived: Boolean(studentData.is_archived),
                    owner_uid: studentData.owner_uid || "",
                    last_seen_at: studentData.last_seen_at || "",
                    progressMap,
                    progressCount: Object.keys(progressMap).length
                });
            }

            students.sort((a, b) => String(b.last_seen_at).localeCompare(String(a.last_seen_at)));
            return students;
        }

        async function createStudentFromTeacher() {
            ensureTeacherAuth();
            const now = new Date().toISOString();

            for (let attempt = 0; attempt < 20; attempt += 1) {
                const candidateId = generateStudentId();
                const studentRef = db.collection("students").doc(candidateId);
                const studentDoc = await studentRef.get();

                if (studentDoc.exists) {
                    continue;
                }

                await studentRef.set({
                    student_id: candidateId,
                    owner_uid: "",
                    display_name: "",
                    is_archived: false,
                    created_at: now,
                    last_seen_at: ""
                });

                teacherDashboardNotice = `Создан ученик: ${candidateId}`;
                await showTeacherDashboard();
                return;
            }

            throw new Error("student_id_generation_failed");
        }

        async function renameStudent(student) {
            ensureTeacherAuth();
            const nextName = window.prompt("Введите имя ученика", student.display_name || "");
            if (nextName === null) return;

            await db.collection("students").doc(student.id).set({
                display_name: nextName.trim()
            }, { merge: true });

            teacherDashboardNotice = nextName.trim()
                ? `Имя сохранено для ${student.id}`
                : `Имя очищено для ${student.id}`;
            await showTeacherDashboard();
        }

        async function copyStudentCode(studentId) {
            ensureTeacherAuth();
            try {
                if (!navigator.clipboard || !navigator.clipboard.writeText) {
                    throw new Error("clipboard_unavailable");
                }

                await navigator.clipboard.writeText(studentId);
                teacherDashboardNotice = `Код скопирован: ${studentId}`;
            } catch (error) {
                teacherDashboardNotice = `Код для копирования: ${studentId}`;
                window.prompt("Скопируйте код ученика вручную", studentId);
            }

            showTeacherNotice(teacherDashboardNotice);
            teacherDashboardNotice = "";
        }

        function showTeacherNotice(message) {
            if (!message) return;

            const contentContainer = document.querySelector(".teacher-content-container");
            if (!contentContainer) {
                setStatus(message);
                return;
            }

            let notice = contentContainer.querySelector(".teacher-notice");
            if (!notice) {
                notice = document.createElement("div");
                notice.className = "teacher-notice";
                const toolbar = contentContainer.querySelector(".teacher-actions");

                if (toolbar && toolbar.nextSibling) {
                    contentContainer.insertBefore(notice, toolbar.nextSibling);
                } else {
                    contentContainer.appendChild(notice);
                }
            }

            notice.textContent = message;
        }

        async function archiveStudent(studentId) {
            ensureTeacherAuth();
            await db.collection("students").doc(studentId).set({
                is_archived: true
            }, { merge: true });

            teacherDashboardNotice = `Ученик архивирован: ${studentId}`;
            await showTeacherDashboard();
        }

        async function resetStudentProgress(studentId) {
            ensureTeacherAuth();
            const progressSnapshot = await db
                .collection("students")
                .doc(studentId)
                .collection("wordProgress")
                .get();

            const docs = progressSnapshot.docs;
            while (docs.length) {
                const batch = db.batch();
                docs.splice(0, 400).forEach(doc => {
                    batch.delete(doc.ref);
                });
                await batch.commit();
            }

            teacherDashboardNotice = `Прогресс сброшен для ${studentId}`;
            await showTeacherDashboard();
        }

        function startTrainingSession(pos, rawWords) {
            cancelPendingQuestionAdvance();
            enterQuestionScreen();
            console.log('Запускаем тренировку:', pos, rawWords.length);
            
            setLoading(true);
            document.getElementById('backButton').classList.remove('hidden');
            
            try {
                currentBatch = rawWords.slice(0, SESSION_WORD_LIMIT).map(prepareQuestion);
                
                console.log('Загружены слова:', currentBatch.length);
                
                if (currentBatch.length === 0) {
                    setStatus("Слова для тренировки не найдены", "err");
                    setLoading(false);
                    return;
                }
                
                currentPOS = pos;
                currentScreen = "question";
                currentBatchNumber = null;
                currentIndex = 0;
                mistakes = [];
                lastErrorsForReview = [];
                isReviewMode = false;
                answered = false;

                setSubtitle('');
                clearOptions();
                clearSummary();
                clearFooterButtons();
                setStatus("");
                setSessionInfo("");
                hideBatchesSelection();

                setLoading(false);
                showQuestion();
                
            } catch (error) {
                console.error('Ошибка загрузки слов:', error);
                setStatus("Ошибка загрузки слов", "err");
                setLoading(false);
            }
        }

        function showQuestion() {
            clearOptions();
            clearSummary();
            clearFooterButtons();
            setStatus("");

            if (!currentBatch.length || currentIndex >= currentBatch.length) {
                finishSession();
                return;
            }

            const q = currentBatch[currentIndex];
            showQuestionProgress();

            const box = document.getElementById("options");
            q.options.forEach((opt, idx) => {
                const btn = document.createElement("button");
                btn.className = "option-btn";
                btn.textContent = opt;
                btn.style.animationDelay = `${idx * 20}ms`;
                btn.onclick = () => checkAnswer(idx, btn);
                box.appendChild(btn);
            });
        }

        function showQuestionProgress() {
            const total = currentBatch.length;
            const current = Math.min(currentIndex + 1, total);
            const percent = total ? Math.round((current / total) * 100) : 0;
            const el = document.getElementById("sessionInfo");

            if (!el || !total) {
                setSessionInfo("");
                return;
            }

            const previousFill = el.querySelector(".question-progress-fill");
            const previousWidth = previousFill ? previousFill.style.width : "0%";
            const title = currentPOS || (isReviewMode ? "Отработка ошибок" : "Задание");

            if (!el.querySelector(".question-progress")) {
                el.innerHTML = `
                    <div class="question-progress">
                        <div class="question-progress-title"></div>
                        <div class="question-progress-track">
                            <div class="question-progress-fill" style="width: ${previousWidth}"></div>
                        </div>
                    </div>
                    <div class="question-card">
                        <div class="question-card-accent" aria-hidden="true"></div>
                        <img class="question-card-icon" alt="" src="${FIGMA_ASSETS.pencil}" aria-hidden="true">
                        <div class="question-card-text">В каком слове <strong>верно</strong> поставлено ударение?</div>
                    </div>
                `;
            }

            const titleEl = el.querySelector(".question-progress-title");
            if (titleEl) renderQuestionProgressTitle(titleEl, title);

            requestAnimationFrame(() => {
                const fill = el.querySelector(".question-progress-fill");
                if (fill) fill.style.width = `${percent}%`;
            });
        }

        function checkAnswer(index, buttonEl) {
            if (answered || !currentBatch.length || currentIndex >= currentBatch.length) return;
            answered = true;

            const q = currentBatch[currentIndex];
            const isCorrect = index === q.correctIndex;
            markWordAsSeen(q, isCorrect);
            disableAllOptions();

            if (isCorrect) {
                buttonEl.classList.add("correct");
                pendingQuestionAdvanceTimeout = setTimeout(() => {
                    pendingQuestionAdvanceTimeout = null;
                    answered = false;
                    currentIndex++;
                    showQuestion();
                }, DELAY_AFTER_CORRECT);
            } else {
                buttonEl.classList.add("wrong");
                highlightCorrect();
                mistakes.push(q);
                pendingQuestionAdvanceTimeout = setTimeout(() => {
                    pendingQuestionAdvanceTimeout = null;
                    answered = false;
                    currentIndex++;
                    showQuestion();
                }, DELAY_AFTER_WRONG);
            }
        }

        function launchConfetti() {
    const target = document.querySelector(".summary-congrats.success-center");

    if (!target) return;

    const rect = target.getBoundingClientRect();

    const colors = [
        "#7C7FF2",
        "#A7A9FF",
        "#FFD166",
        "#EF476F",
        "#6EE7B7",
        "#F9A8D4",
        "#FFB86B"
    ];

    const centerY = rect.top + rect.height / 2;
    const centerX = rect.left + rect.width / 2;

    const burstPoints = [
        { x: centerX - rect.width * 0.42, y: centerY - 42 },
        { x: centerX - rect.width * 0.28, y: centerY + 18 },
        { x: centerX + rect.width * 0.32, y: centerY - 36 },
        { x: centerX + rect.width * 0.46, y: centerY + 10 }
    ];

    const totalWaves = 3;
    const piecesPerBurst = 14;

    for (let wave = 0; wave < totalWaves; wave++) {
        burstPoints.forEach((point, pointIndex) => {
            const delay = wave * 360 + pointIndex * 90 + Math.random() * 140;

            setTimeout(() => {
                for (let i = 0; i < piecesPerBurst; i++) {
                    const piece = document.createElement("div");
                    piece.className = "firework-piece";

                    const angle = Math.random() * Math.PI * 2;

                    // Разлёт тоже немного шире, чтобы залпы не выглядели комком.
                    const distance = 42 + Math.random() * 120;

                    const x = Math.cos(angle) * distance;
                    const y = Math.sin(angle) * distance;

                    const size = 4 + Math.random() * 7;

                    piece.style.left = `${point.x + (Math.random() * 22 - 11)}px`;
                    piece.style.top = `${point.y + (Math.random() * 18 - 9)}px`;
                    piece.style.width = `${size}px`;
                    piece.style.height = `${size}px`;
                    piece.style.background = colors[Math.floor(Math.random() * colors.length)];
                    piece.style.setProperty("--x", `${x}px`);
                    piece.style.setProperty("--y", `${y}px`);
                    piece.style.animationDuration = `${1500 + Math.random() * 900}ms`;

                    document.body.appendChild(piece);

                    setTimeout(() => piece.remove(), 2800);
                }
            }, delay);
        });
    }
}

        function finishSession() {
            cancelPendingQuestionAdvance();
            leaveQuestionScreen();
            clearOptions();
            clearSummary();
            setStatus("");
            setSessionInfo("");
            setSubtitle("");
            document.getElementById('backButton').classList.add('hidden');

            const summary = document.getElementById("summary");
            const footer = document.getElementById("footerButtons");
            footer.innerHTML = "";

            const buttonsWrap = document.createElement("div");
            buttonsWrap.className = "result-buttons";

            const sessionWasReview = isReviewMode;
            const errors = mistakes.slice();
            lastErrorsForReview = errors.slice();
            const hasErrors = errors.length > 0;
            const unresolvedErrors = currentPOS ? getUnresolvedErrorWordsByPOS(currentPOS) : [];
            const shouldShowReviewButton = sessionWasReview ? hasErrors : unresolvedErrors.length > 0;

            footer.classList.remove("final-success-footer", "final-error-footer", "final-finished-footer");
            buttonsWrap.classList.remove("final-success-buttons", "final-error-buttons", "final-finished-buttons");

            if (sessionWasReview && !hasErrors) {
                setResultScreenState("finished");
                showSuccessSummary("Всё отработано!", summary, "finished");
                footer.classList.add("final-finished-footer");
                buttonsWrap.classList.add("final-finished-buttons");
            } else if (!sessionWasReview && !hasErrors) {
                setResultScreenState("success");
                showSuccessSummary(getRandomPerfectResultTitle(), summary, "perfect");
                footer.classList.add("final-success-footer");
                buttonsWrap.classList.add("final-success-buttons");
            } else {
                setResultScreenState("error");
                const words = [...new Set(errors.map(q => q.correct))];
                showErrorSummary(words, summary);
                footer.classList.add("final-error-footer");
                buttonsWrap.classList.add("final-error-buttons");
            }

            if (shouldShowReviewButton) {
                const reviewBtn = makeResultBtn("Отработать слова", startReviewSession);
                reviewBtn.classList.add("review-primary");
                buttonsWrap.appendChild(reviewBtn);
            }

            if (currentPOS) {
                buttonsWrap.appendChild(makeResultBtn("Ещё слова этой части речи", () => startNextTraining(currentPOS)));
            }

            buttonsWrap.appendChild(makeResultBtn("Выбрать другую часть речи", loadPartsOfSpeech));

            const resultContent = summary.querySelector(".result-screen-content");
            if (resultContent) {
                resultContent.appendChild(buttonsWrap);
            } else {
                footer.appendChild(buttonsWrap);
            }
            isReviewMode = false;
        }

        function startReviewSession() {
            cancelPendingQuestionAdvance();
            const errorWords = getReviewWordsForCurrentSession();

            if (!errorWords.length) {
                setStatus("Нет ошибок для отработки 🎉", "err");
                return;
            }

            enterQuestionScreen();
            document.getElementById('backButton').classList.remove('hidden');
            currentScreen = "question";
            isReviewMode = true;
            mistakes = [];
            answered = false;

            currentBatch = errorWords.slice(0, SESSION_WORD_LIMIT).map(prepareQuestion);
            currentIndex = 0;

            clearOptions();
            clearSummary();
            clearFooterButtons();
            setStatus("");
            setSessionInfo("");
            setSubtitle('');

            showQuestion();
        }

        function getReviewWordsForCurrentSession() {
            if (!currentPOS) return [];

            if (lastErrorsForReview.length) {
                const wordsById = new Map(getAllWordsByPOS(currentPOS).map(word => [word.word_id, word]));
                const usedIds = new Set();

                return lastErrorsForReview
                    .map(item => wordsById.get(item.word_id))
                    .filter(Boolean)
                    .filter(word => {
                        if (usedIds.has(word.word_id)) return false;
                        usedIds.add(word.word_id);
                        return true;
                    });
            }

            return getUnresolvedErrorWordsByPOS(currentPOS);
        }

        function showErrorSummary(words, container) {
            const content = document.createElement("div");
            content.className = "result-screen-content";

            const title = document.createElement("div");
            title.className = "summary-subtitle";
            title.textContent = words.length === 1 ?

            content.appendChild(title);

            const wrap = document.createElement("div");
            wrap.className = "summary-list-wrapper";
            const ul = document.createElement("ul");
            ul.className = "summary-list";

            words.forEach(word => {
                const li = document.createElement("li");
                li.textContent = word;
                ul.appendChild(li);
            });

            wrap.appendChild(ul);
            content.appendChild(wrap);
            container.appendChild(content);
        }
